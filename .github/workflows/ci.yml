name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }}, pyspark ${{ matrix.pyspark }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported Spark/Python combinations, plus the latest Spark on the
        # newest Python. pyspark 3.5's pandas support imports distutils, which
        # Python 3.12 dropped, so that job also installs setuptools.
        include:
          - python-version: "3.12"
            pyspark: "3.5.*"
            extra: setuptools
          - python-version: "3.12"
            pyspark: "4.0.*"
          - python-version: "3.12"
            pyspark: "4.1.*"
          - python-version: "3.13"
            pyspark: "4.3.*"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs needs tags to compute the version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync --locked

      - name: pin pyspark ${{ matrix.pyspark }}
        run: uv pip install "pyspark==${{ matrix.pyspark }}" ${{ matrix.extra }}

      # --no-sync keeps the pinned pyspark instead of re-syncing to the lock.
      - run: uv run --no-sync pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --locked

      - name: ruff
        run: uv run ruff check .

      - name: ruff format
        if: always()
        run: uv run ruff format --check .

      - name: mypy
        if: always()
        run: uv run mypy typespark/

      - name: pyright
        if: always()
        run: uv run pyright typespark/ tests/
