[project]
name = "typespark"
dynamic = ["version"]
description = "Static typing for PySpark DataFrames"
authors = [{ name = "Elias Ågeby", email = "elias.ageby@gmail.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["pyspark", "spark", "dataframe", "typing", "type-safety", "schema"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "attrs>=25.1.0,<26",
    "pyyaml>=6.0.2,<7",
    "simple-parsing>=0.1.7,<0.2",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
pyspark = ["pyspark>=3.5.2,<4.1"]
datacontract = [
    "pyspark>=3.5.2,<4.1",
    "black>=25.1.0,<26",
    "datacontract-specification>=1.2.0,<2",
    "click>=8.2.1,<9",
]

[project.urls]
Repository = "https://github.com/eageby/typespark"
Issues = "https://github.com/eageby/typespark/issues"

[project.scripts]
typespark = "typespark.data_contract.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0,<2",
    "pytest>=8.3.4,<9",
    "pandas>=2.2.3,<3",
    "pyarrow>=19.0.0,<20",
    "prettyprinter>=0.18.0,<0.19",
    "devtools>=0.12.2,<0.13",
    "pyspark>=3.5.2,<4.1",
    "pyright>=1.1.414",
]
datacontract = ["typespark[datacontract]"]

[tool.uv]
default-groups = [
    "dev",
    "datacontract",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = ["typespark", "tests", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["typespark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
